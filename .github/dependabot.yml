# Security-first Dependabot configuration:
# Keeps GitHub Dependency Graph & Dependabot security alerts/updates active (100% compliant with Glama),
# while setting open-pull-requests-limit: 0 on routine version bumps to prevent noisy PR spam.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directory: "/src/cli"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directory: "/src/viewer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directory: "/src/clipboard/rust_clipboard"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directory: "/src/service/rust_content"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
