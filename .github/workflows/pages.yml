name: Deploy Official Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - 'docs/images/**'
      - 'resources/Tools3000-T-signature-assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Static Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static website bundle
        run: |
          mkdir -p _site/images/en-US _site/images/zh-CN
          cp docs/site/index.html _site/index.html
          cp resources/Tools3000-T-signature-assets/t-ribbon-color.svg _site/logo.svg
          if [ -f docs/images/social-preview-1280x640.png ]; then
            cp docs/images/social-preview-1280x640.png _site/images/social-preview-1280x640.png
          fi
          cp docs/images/en-US/*.webp _site/images/en-US/
          cp docs/images/zh-CN/*.webp _site/images/zh-CN/
          touch _site/.nojekyll

      - name: Upload Pages artifact (v4)
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
