name: 'Tools3000 CI & Manual Release Pipeline'

# 权威发版源约定 (D-03):
# 正式版本以本地 scripts/release.ps1 权威签名构建与发布为准。
# 严禁监听 push.tags 自动触发云端打包上传，彻底杜绝本地 git push --tags 后被云端未签名构建覆盖正式版资产。
'on':
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
    branches:
      - 'main'
      - 'master'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual Release Version (e.g. 1.2.0, leave empty to read VERSION)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish GitHub Release assets (manual fallback only)'
        required: false
        default: false
        type: boolean
      overwrite_existing:
        description: 'Allow overwriting an existing GitHub Release (keep false to protect local signed assets)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Test & Verify (Manual Release Optional)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-archives
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Setup Inno Setup Compiler
        run: |
          choco install innosetup --yes --no-progress
          Write-Host "[OK] Inno Setup installed successfully."
        shell: pwsh

      - name: Setup MSVC & CMake Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Cache vcpkg Binary Artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-archives-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-x64-

      - name: Resolve and Verify Product Version
        id: resolve-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $VersionFromFile = if (Test-Path "VERSION") { (Get-Content "VERSION" -Raw).Trim() } else { throw "Missing VERSION file" }
          $TargetVer = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) { $env:INPUT_VERSION.Trim().TrimStart('v') } else { $VersionFromFile }
          $Tag = "v$TargetVer"
          pwsh -File .\scripts\verify-version.ps1 -Tag $Tag
          Write-Host "[OK] Verified Release Tag: $Tag (Version: $TargetVer)" -ForegroundColor Green
          "RELEASE_TAG=$Tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$TargetVer" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Check Existing GitHub Release Protection Gate
        id: release-gate
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}
        run: |
          $Exists = $false
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $Exists = $true }
          if ($Exists -and $env:OVERWRITE_EXISTING -ne 'true') {
            throw "[ERROR] GitHub Release $($env:RELEASE_TAG) already exists (published by authoritative local release pipeline). Refusing to overwrite without overwrite_existing=true."
          }
          "allow_upload=true" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build Frontend, C++ Core & Stage deploy_dist (Pre-Installer)
        run: |
          $QuickArg = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { @() } else { @("-Quick") }
          pwsh -File .\deploy.ps1 -Configuration Release @QuickArg -SkipTests -SkipInstaller
        shell: pwsh

      - name: Run C++ Native Unit Tests (Headless Adapted)
        run: |
          $TestExe = "build\bin\Release\Tools3000Tests.exe"
          if (-not (Test-Path $TestExe)) { $TestExe = "build\bin\Tools3000Tests.exe" }
          if (-not (Test-Path $TestExe)) { throw "Tools3000Tests.exe not found under build/bin!" }
          Write-Host "[INFO] Running native test suite: $TestExe" -ForegroundColor Cyan
          & $TestExe --gtest_brief=1
          if ($LASTEXITCODE -ne 0) { throw "Native unit tests failed with exit code $LASTEXITCODE" }
        shell: pwsh

      - name: Check Cloud Code Signing Configuration
        id: signing-config
        if: github.event_name == 'workflow_dispatch'
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          HAS_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $Enabled = ($env:HAS_TOKEN -eq 'true' -and $env:HAS_ORG -eq 'true')
          "enabled=$($Enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 第一轮签名：若启用云端签名，先对 deploy_dist 内的 .exe/.dll 二进制签名，再制作便携 ZIP 与 Setup.exe
      - name: Package Unsigned Inner Binaries for First-Pass SignPath Signing
        if: steps.signing-config.outputs.enabled == 'true'
        run: |
          $InnerStage = "Output\UnsignedInner"
          if (Test-Path $InnerStage) { Remove-Item -Recurse -Force $InnerStage }
          New-Item -ItemType Directory -Path "$InnerStage\plugins" -Force | Out-Null
          Get-ChildItem -Path "deploy_dist" -File | Where-Object {
            $_.Extension -in @(".exe", ".dll") -and
            (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne "Valid"
          } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $InnerStage $_.Name) -Force
          }
          Get-ChildItem -Path "deploy_dist\plugins\Plugin_*.dll" -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path "$InnerStage\plugins" $_.Name) -Force
          }
          Compress-Archive -Path "$InnerStage\*" -DestinationPath "Output\Tools3000-InnerBinaries-Unsigned.zip" -Force
        shell: pwsh

      - name: Upload Unsigned Inner Binaries for SignPath
        if: steps.signing-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        id: upload-unsigned-inner
        with:
          name: Tools3000-InnerBinaries-Unsigned
          path: Output\Tools3000-InnerBinaries-Unsigned.zip
          retention-days: 1

      - name: Submit First-Pass Inner Binary Signing Request to SignPath
        if: steps.signing-config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'tools3000'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned-inner.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'Output\SignedInner'

      - name: Apply Signed Inner Binaries Back to deploy_dist
        if: steps.signing-config.outputs.enabled == 'true'
        run: |
          $SignedZip = Get-ChildItem "Output\SignedInner\*.zip" -Recurse | Select-Object -First 1
          $ExtractDir = "Output\SignedInner\extracted"
          if ($SignedZip) {
            Expand-Archive -LiteralPath $SignedZip.FullName -DestinationPath $ExtractDir -Force
          } else {
            $ExtractDir = "Output\SignedInner"
          }
          Get-ChildItem -Path $ExtractDir -File | Where-Object { $_.Extension -in @(".exe", ".dll") } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path "deploy_dist" $_.Name) -Force
          }
          if (Test-Path "$ExtractDir\plugins") {
            Get-ChildItem -Path "$ExtractDir\plugins\Plugin_*.dll" -File | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path "deploy_dist\plugins" $_.Name) -Force
            }
          }
          Write-Host "[OK] Applied first-pass signed binaries into deploy_dist." -ForegroundColor Green
        shell: pwsh

      # 打包阶段：在 deploy_dist 完成内层签名后，构建便携 ZIP 与 Inno Setup 安装包
      - name: Build Portable Archive and Inno Setup Installer
        run: |
          if (-not (Test-Path "Output")) { New-Item -ItemType Directory -Path "Output" -Force | Out-Null }
          $Tag = $env:RELEASE_TAG
          $Ver = $env:RELEASE_VERSION
          $PortableZip = "Output\Tools3000-win-x64-portable.zip"
          $GenericPortableZip = "Output\Tools3000-Portable-x64.zip"
          $VersionedPortableZip = "Output\Tools3000-$Tag-win-x64-portable.zip"
          if (Test-Path $PortableZip) { Remove-Item -Force $PortableZip }
          Compress-Archive -Path "deploy_dist\*" -DestinationPath $PortableZip -CompressionLevel Optimal -Force
          Copy-Item -LiteralPath $PortableZip -Destination $GenericPortableZip -Force
          Copy-Item -LiteralPath $PortableZip -Destination $VersionedPortableZip -Force

          $ISCC = if (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue) {
            (Get-Command "ISCC.exe").Source
          } else {
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $ISCC)) { throw "ISCC.exe not found!" }

          $CompressionArg = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "/DCompressionLevel=lzma2/ultra64" } else { "/DCompressionLevel=lzma2/fast" }
          & $ISCC "/DTools3000Version=$Ver" "/DTools3000Architecture=x64" "/DTools3000SetupBaseFilename=Tools3000-Setup" "/DDeployDir=deploy_dist" $CompressionArg "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC compilation failed with exit code $LASTEXITCODE" }

          $SetupPath = "Output\Tools3000-Setup.exe"
          if (-not (Test-Path -LiteralPath $SetupPath)) { throw "Installer artifact not found at: $SetupPath" }
          Copy-Item -LiteralPath $SetupPath -Destination "Output\Tools3000-$Tag-Setup.exe" -Force
          Write-Host "[OK] Portable ZIP and Setup.exe built successfully." -ForegroundColor Green
        shell: pwsh

      # 第二轮签名：对生成的 Tools3000-Setup.exe 进行外层签名
      - name: Upload Unsigned Outer Installer for SignPath
        if: steps.signing-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        id: upload-unsigned-installer
        with:
          name: Tools3000-Setup-Unsigned
          path: Output\Tools3000-Setup.exe
          retention-days: 1

      - name: Submit Outer Installer Signing Request to SignPath
        if: steps.signing-config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'tools3000'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'Output\SignedOuter'

      - name: Replace Outer Installer with Official Signed Artifact
        if: steps.signing-config.outputs.enabled == 'true'
        run: |
          $SignedFile = Get-ChildItem "Output\SignedOuter\*.exe" -Recurse | Select-Object -First 1
          if (-not $SignedFile) {
            $SignedZip = Get-ChildItem "Output\SignedOuter\*.zip" -Recurse | Select-Object -First 1
            if ($SignedZip) {
              Expand-Archive -LiteralPath $SignedZip.FullName -DestinationPath "Output\SignedOuter\unzipped" -Force
              $SignedFile = Get-ChildItem "Output\SignedOuter\unzipped\*.exe" -Recurse | Select-Object -First 1
            }
          }
          if ($SignedFile) {
            Copy-Item -Path $SignedFile.FullName -Destination "Output\Tools3000-Setup.exe" -Force
            Copy-Item -Path $SignedFile.FullName -Destination "Output\Tools3000-$($env:RELEASE_TAG)-Setup.exe" -Force
            Write-Host "[OK] Replaced outer installer with signed artifact: $($SignedFile.FullName)" -ForegroundColor Green
          } else {
            throw "SignPath outer signing request completed without producing a signed .exe installer!"
          }
        shell: pwsh

      - name: Generate SHA256SUMS Manifest
        run: |
          $ReleaseArtifacts = @(
            "Output\Tools3000-Setup.exe",
            "Output\Tools3000-$($env:RELEASE_TAG)-Setup.exe",
            "Output\Tools3000-Portable-x64.zip",
            "Output\Tools3000-win-x64-portable.zip",
            "Output\Tools3000-$($env:RELEASE_TAG)-win-x64-portable.zip"
          )
          $ChecksumLines = @()
          foreach ($File in ($ReleaseArtifacts | Sort-Object)) {
            if (Test-Path -LiteralPath $File) {
              $Item = Get-Item -LiteralPath $File
              $H = (Get-FileHash -LiteralPath $Item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $ChecksumLines += "$H *$($Item.Name)"
            }
          }
          $Content = ($ChecksumLines -join "`r`n") + "`r`n"
          [System.IO.File]::WriteAllText("Output\SHA256SUMS.txt", $Content, [System.Text.Encoding]::ASCII)
          Write-Host "[OK] Generated SHA256SUMS.txt:"
          Write-Host $Content
        shell: pwsh

      - name: Create GitHub Release and Upload Assets (Manual Dispatch Only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.release-gate.outputs.allow_upload == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tools3000 ${{ env.RELEASE_TAG }}
          files: |
            Output/Tools3000-Setup.exe
            Output/Tools3000-${{ env.RELEASE_TAG }}-Setup.exe
            Output/Tools3000-Portable-x64.zip
            Output/Tools3000-win-x64-portable.zip
            Output/Tools3000-${{ env.RELEASE_TAG }}-win-x64-portable.zip
            Output/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
