<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Tools3000 官方方案 1: 超速滑翔光翼 E (The Aero-Glide 'E') -->
  <!-- 完美 1:1 还原渲染母版气动前倾曲率、三段微重叠飞翼与丝滑贝塞尔流动节点 -->
  <defs>
    <!-- 微折叠层叠暗部渐变 (赋予 2D 矢量纯净而真实的三维折纸深度) -->
    <linearGradient id="foldGradTop" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="foldGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <!-- 纯白单色模式滤镜/填色定义 -->
  </defs>

  <g id="aero-glide-e-master-group">
    <!-- 1. 底层滑行稳舵翼 (Bottom Glide Wing) -->
    <path id="bottom-wing"
      d="M175 330 
         C200 330, 310 330, 340 330 
         C375 330, 395 350, 370 380 
         C345 410, 305 425, 270 425 
         L145 425 
         C120 425, 105 405, 120 380 
         Z" 
      fill="url(#foldGradTop)" />

    <!-- 2. 中层穿梭主翼 (Middle Cruise Wing) -->
    <path id="middle-wing"
      d="M195 215 
         C225 215, 300 215, 335 215 
         C370 215, 385 235, 365 260 
         C345 285, 315 295, 280 295 
         L165 295 
         C145 295, 135 280, 145 260 
         Z" 
      fill="url(#foldGradMid)" />

    <!-- 3. 前倾动能主脊椎 (Swept-Forward Kinetic Spine) -->
    <path id="main-spine"
      d="M205 95 
         C235 95, 260 95, 280 95 
         C250 180, 200 320, 145 425 
         L95 425 
         C85 425, 80 415, 85 400 
         C110 340, 160 200, 205 95 
         Z" 
      fill="url(#spineGrad)" />

    <!-- 4. 顶层破空前扬飞翼 (Top Aero-Sweep Wing - 视觉主体) -->
    <path id="top-wing"
      d="M205 95 
         C235 95, 350 95, 385 95 
         C425 95, 435 118, 400 152 
         C365 186, 310 195, 275 195 
         L185 195 
         C165 195, 155 180, 168 158 
         C180 138, 192 118, 205 95 
         Z" 
      fill="url(#foldGradTop)" />
  </g>
</svg>
