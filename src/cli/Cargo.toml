[package]
name = "tools3000_cli"
version = "1.4.5"
edition = "2021"
description = "Zero-dependency ultra-fast CLI & Model Context Protocol (MCP) stdio server for Tools3000 NTFS file and document content search"
license = "GPL-3.0-only"

[[bin]]
name = "tools3000-cli"
path = "src/main.rs"

[dependencies]
# 故意保持零 crates.io 第三方依赖：
# 1. 编译耗时 < 1.5s，100% 支持离线环境与 x64/ARM64 交叉构建；
# 2. 单文件体积约 250KB，冷启动 < 3ms，供应链审计 100% 透明。

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
