[package]
name = "tools3000_picasa_viewer"
version = "1.5.0"
edition = "2021"
description = "Modern Picasa-inspired ultra-fast native Windows image viewer (tribute to Google Picasa Photo Viewer) with animated GIF/WebP/SVG/WIC support"
license = "GPL-3.0-only"

[[bin]]
name = "Tools3000_Picasa_Viewer"
path = "src/main.rs"

[dependencies]
# 纯 Rust 内存安全动图与现代格式解码器（零 C 运行时依赖）
flate2 = "1"
gif = "0.13"
image-webp = "0.2"
png = "0.17"
resvg = { version = "0.45", default-features = false }

# 微软官方零成本 Win32 / Direct2D / DirectComposition / DirectWrite / WIC 绑定
[dependencies.windows]
version = "0.58"
features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
